name: Deploy invitation to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Browsers cache CSS/JS hard, so an edit to the couple's details can
      # keep showing the old text to anyone who has opened the page before.
      # Stamping the commit onto the asset URLs makes each deploy a new URL.
      - name: Stamp the build onto the asset URLs
        run: sed -i "s/__BUILD__/${GITHUB_SHA::7}/g" index.html

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          # The site is plain HTML/CSS/JS at the repository root — nothing to build.
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
